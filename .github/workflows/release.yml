name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 创建草稿 Release（仅 tag 触发时生效；手动触发时跳过，构建产物仅作为 workflow artifacts）
  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release (draft)
        id: create-release
        uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

  # 三平台并行构建打包
  build:
    name: Package (${{ matrix.platform.name }})
    needs: create-release
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            name: linux-x64
            args: ''
          - os: macos-latest
            name: macos-arm64
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            name: macos-x64
            args: '--target x86_64-apple-darwin'
          - os: windows-latest
            name: windows-x64
            args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # 用 perl 而非 sed：macOS runner 使用 BSD sed，-i 语法与 GNU sed 不同
          export VERSION
          perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/' src-tauri/Cargo.toml
          npm pkg set version="${VERSION}"

      - name: Install frontend dependencies
        run: npm install

      # tauri build 通过 beforeBuildCommand 自动执行 vite 构建；
      # tag 触发时上传到草稿 Release，手动触发时仅上传 workflow artifacts。
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          args: ${{ matrix.platform.args }}
